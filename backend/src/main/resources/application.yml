server:
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: face-gate
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/face_gate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:face_gate}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
app:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
  face-url: ${FACE_SERVICE_URL:http://localhost:8000}
  face-key: ${FACE_SERVICE_KEY}
  threshold: ${FACE_THRESHOLD:0.45}
  margin: ${FACE_MARGIN:0.05}
  zone: Asia/Shanghai
